name: Hotel booking checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile || yarn install
      - run: yarn typecheck
      - run: yarn lint

  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Perix-main/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/test_date_range_utils.py
