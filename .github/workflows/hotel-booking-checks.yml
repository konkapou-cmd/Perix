name: Hotel booking checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --version && npm --version
      - run: npm ci --ignore-scripts --loglevel verbose
      - run: npx expo postinstall 2>/dev/null || true
      - run: npm run typecheck:hotel
      - run: npm run lint

  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Perix-main/backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: perix_hotel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "import asyncio, database; asyncio.run(database.db.command('ping'))"
      - run: python -m pytest --collect-only -q tests/test_date_range_utils.py tests/test_date_range_booking.py tests/test_date_range_booking_concurrency.py tests/test_hotel_service_validation.py tests/test_migration.py
      - run: python -m pytest -v --tb=short tests/test_date_range_utils.py tests/test_date_range_booking.py tests/test_date_range_booking_concurrency.py tests/test_hotel_service_validation.py tests/test_migration.py
